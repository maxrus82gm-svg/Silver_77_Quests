<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуальный просмотр .layout файлов DayZ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 30px; background: #f5f5f5; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        #file-input { margin: 20px 0; }
        #visual-container {
            position: relative;
            width: 1000px; height: 600px;
            border: 2px solid #34495e; background: #fff; overflow: hidden; margin-top: 20px;
            background-image: linear-gradient(#ccc 1px, transparent 1px),
                            linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .ui-element {
            position: absolute;
            border: 1px solid black;
            box-sizing: border-box;
            opacity: 0.7;
        }
        footer { margin-top: 30px; color: #7f8c8d; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Визуальный просмотрщик .layout файлов (только чтение)</h1>
    <p><strong>Внимание:</strong> Загрузите .layout файл для визуализации UI-элементов.</p>
    
    <label for="file-input">Выберите .layout файл:</label>
    <input type="file" id="file-input" accept=".layout" />
    
    <div id="visual-container"></div>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const container = document.getElementById('visual-container');
                container.innerHTML = '';

                // Ядро парсера .layout файлов DayZ с расширенными свойствами
                function parseLayout(content) {
                    const lines = content.split('\n');
                    const nodeStack = [];
                    const allNodes = [];
                    let rootNode = null;
                    
                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i].trim();
                        
                        // Ищем начало нового UI-элемента
                        const classMatch = line.match(/^\s*(\w+WidgetClass)\s+(\w+)\s*\{/);
                        if (classMatch) {
                            const parentNode = nodeStack.length > 0 ? nodeStack[nodeStack.length - 1] : null;
                            const newNode = {
                                id: allNodes.length,
                                type: classMatch[1],
                                name: classMatch[2],
                                position: null,
                                size: null,
                                color: null,
                                text: null,
                                font: null,
                                props: {},
                                parent: parentNode,
                                parentId: parentNode ? parentNode.id : -1,
                                parentName: parentNode ? parentNode.name : null,
                                children: [],
                                absX: 0,
                                absY: 0
                            };
                            
                            if (parentNode) {
                                parentNode.children.push(newNode);
                            } else {
                                rootNode = newNode;
                            }
                            
                            allNodes.push(newNode);
                            nodeStack.push(newNode);
                        }
                        
                        // Парсим свойства текущего узла
                        if (nodeStack.length > 0) {
                            const currentNode = nodeStack[nodeStack.length - 1];
                            
                            // position (формат: position x y)
                            const posMatch = line.match(/^\s*position\s+([\d\.]+)\s+([\d\.]+)/);
                            if (posMatch) {
                                currentNode.position = {
                                    x: parseFloat(posMatch[1]) || 0,
                                    y: parseFloat(posMatch[2]) || 0
                                };
                            }
                            
                            // size (формат: size w h)
                            const sizeMatch = line.match(/^\s*size\s+([\d\.]+)\s+([\d\.]+)/);
                            if (sizeMatch) {
                                currentNode.size = {
                                    w: parseFloat(sizeMatch[1]) || 0,
                                    h: parseFloat(sizeMatch[2]) || 0
                                };
                            }
                            
                            // color (формат: color r g b a)
                            const colorMatch = line.match(/^\s*color\s+([\d\.]+)\s+([\d\.]+)\s+([\d\.]+)\s+([\d\.]+)/);
                            if (colorMatch) {
                                currentNode.color = {
                                    r: parseFloat(colorMatch[1]) || 0,
                                    g: parseFloat(colorMatch[2]) || 0,
                                    b: parseFloat(colorMatch[3]) || 0,
                                    a: parseFloat(colorMatch[4]) || 1
                                };
                            }
                            
                            // text (формат: text "текст" или text текст)
                            const textMatch = line.match(/^\s*text\s+(?:"([^"]*)"|(\S.*))$/);
                            if (textMatch) {
                                currentNode.text = textMatch[1] || textMatch[2] || '';
                            }
                            
                            // font (формат: font "шрифт" или font шрифт)
                            const fontMatch = line.match(/^\s*font\s+(?:"([^"]*)"|(\S.*))$/);
                            if (fontMatch) {
                                currentNode.font = fontMatch[1] || fontMatch[2] || '';
                            }
                            
                            // quoted props (формат: "ключ" значение)
                            const quotedPropMatch = line.match(/^\s*"([^"]+)"\s+(\S.*)$/);
                            if (quotedPropMatch) {
                                const key = quotedPropMatch[1];
                                const value = quotedPropMatch[2].trim();
                                currentNode.props[key] = value;
                            }
                            
                            // normal props (формат: ключ значение)
                            const normalPropMatch = line.match(/^\s*(\w+)\s+(\S.*)$/);
                            if (normalPropMatch && !['position', 'size', 'color', 'text', 'font', 'ignorepointer', 'halign', 'valign', 'hexactpos', 'vexactpos', 'hexactsize', 'vexactsize'].includes(normalPropMatch[1])) {
                                const key = normalPropMatch[1];
                                const value = normalPropMatch[2].trim();
                                currentNode.props[key] = value;
                            }
                        }
                        
                        // Обрабатываем закрывающую фигурную скобку
                        if (line === '}') {
                            nodeStack.pop();
                        }
                    }
                    
                    // Вычисляем абсолютные координаты для всех узлов
                    function calculateAbsolutePositions(node, parentAbsX = 0, parentAbsY = 0) {
                        // Не прерываем выполнение при отсутствии position
                        if (node.position) {
                            node.absX = parentAbsX + node.position.x;
                            node.absY = parentAbsY + node.position.y;
                        } else {
                            node.absX = parentAbsX;
                            node.absY = parentAbsY;
                        }
                        
                        // Рекурсивно вычисляем для детей
                        node.children.forEach(child => {
                            calculateAbsolutePositions(child, node.absX, node.absY);
                        });
                    }
                    
                    if (rootNode) {
                        calculateAbsolutePositions(rootNode);
                    }
                    
                    return { nodes: allNodes, root: rootNode };
                }
                
                // Функция рендеринга с отображением имени узла
                function renderLayout(container, layoutData) {
                    container.innerHTML = '';
                    
                    layoutData.nodes.forEach(node => {
                        // Пропускаем узлы без size или с нулевым размером
                        if (!node.size || node.size.w <= 0 || node.size.h <= 0) {
                            return;
                        }
                        
                        const div = document.createElement('div');
                        div.className = 'ui-element';
                        div.style.left = (node.absX * 2) + 'px';
                        div.style.top = (node.absY * 2) + 'px';
                        div.style.width = (node.size.w * 2) + 'px';
                        div.style.height = (node.size.h * 2) + 'px';
                        
                        // Если color нет: прозрачный фон + видимая граница
                        if (node.color) {
                            div.style.backgroundColor = `rgba(${Math.round(node.color.r * 255)}, ${Math.round(node.color.g * 255)}, ${Math.round(node.color.b * 255)}, ${node.color.a})`;
                            div.style.border = '1px solid #000';
                        } else {
                            div.style.backgroundColor = 'transparent';
                            div.style.border = '1px dashed #666';
                        }
                        
                        // Добавляем текст с именем узла
                        const nameLabel = document.createElement('div');
                        nameLabel.textContent = node.name;
                        nameLabel.style.position = 'absolute';
                        nameLabel.style.top = '2px';
                        nameLabel.style.left = '2px';
                        nameLabel.style.fontSize = '10px';
                        nameLabel.style.color = '#000';
                        nameLabel.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
                        nameLabel.style.padding = '1px 3px';
                        nameLabel.style.borderRadius = '2px';
                        nameLabel.style.pointerEvents = 'none';
                        div.appendChild(nameLabel);
                        
                        // Формируем tooltip с информацией
                        let tooltip = `${node.type} ${node.name}`;
                        if (node.parentName) {
                            tooltip += `\nРодитель: ${node.parentName}`;
                        }
                        if (node.position) {
                            tooltip += `\nabsX:${node.absX} absY:${node.absY}`;
                            tooltip += `\nrelX:${node.position.x} relY:${node.position.y}`;
                        }
                        tooltip += `\nw:${node.size.w} h:${node.size.h}`;
                        if (node.text) {
                            tooltip += `\nТекст: "${node.text}"`;
                        }
                        if (node.font) {
                            tooltip += `\nШрифт: ${node.font}`;
                        }
                        if (Object.keys(node.props).length > 0) {
                            tooltip += `\nДоп. свойства: ${JSON.stringify(node.props)}`;
                        }
                        
                        div.title = tooltip;
                        container.appendChild(div);
                    });
                    
                    console.log(`Найдено узлов: ${layoutData.nodes.length}`);
                    if (layoutData.root) {
                        console.log(`Корневой узел: ${layoutData.root.type} "${layoutData.root.name}"`);
                    }
                }
                
                // Парсим и рендерим layout
                const layoutData = parseLayout(content);
                renderLayout(container, layoutData);
            };
            reader.readAsText(file);
        });
    </script>

    <footer>
        &copy; 2026 Silver_77_Quests. Только для просмотра. Никакие данные не сохраняются.
    </footer>
</body>
</html>

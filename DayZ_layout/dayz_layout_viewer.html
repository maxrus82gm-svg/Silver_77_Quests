<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуальный просмотр .layout файлов DayZ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 30px; background: #f5f5f5; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        #file-input { margin: 20px 0; }
        #visual-container {
            position: relative;
            width: 1000px; height: 600px;
            border: 2px solid #34495e; background: #fff; overflow: hidden; margin-top: 20px;
            background-image: linear-gradient(#ccc 1px, transparent 1px),
                            linear-gradient(90deg, #ccc 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .ui-element {
            position: absolute;
            border: 1px solid black;
            box-sizing: border-box;
            opacity: 0.7;
        }
        footer { margin-top: 30px; color: #7f8c8d; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Визуальный просмотрщик .layout файлов (только чтение)</h1>
    <p><strong>Внимание:</strong> Загрузите .layout файл для визуализации UI-элементов.</p>
    
    <label for="file-input">Выберите .layout файл:</label>
    <input type="file" id="file-input" accept=".layout" />
    
    <div id="visual-container"></div>

    <script>
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const container = document.getElementById('visual-container');
                container.innerHTML = '';

                // Построчный stack-парсер для .layout файлов DayZ
                const lines = content.split('\n');
                const nodeStack = []; // стек узлов (настоящий стек)
                const elements = []; // найденные UI-элементы для визуализации
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    
                    // Ищем начало нового UI-элемента (класс с именем)
                    const classMatch = line.match(/^\s*(\w+WidgetClass)\s+(\w+)\s*\{/);
                    if (classMatch) {
                        // Создаем новый узел и добавляем в стек
                        const newNode = {
                            type: classMatch[1],
                            name: classMatch[2],
                            position: null,
                            size: null,
                            color: null
                        };
                        nodeStack.push(newNode);
                    }
                    
                    // Если стек не пустой, ищем свойства в текущем узле (последнем в стеке)
                    if (nodeStack.length > 0) {
                        const currentNode = nodeStack[nodeStack.length - 1];
                        
                        // Парсим position (формат: position x y)
                        const posMatch = line.match(/^\s*position\s+([\d\.]+)\s+([\d\.]+)/);
                        if (posMatch) {
                            currentNode.position = {
                                x: parseFloat(posMatch[1]) || 0,
                                y: parseFloat(posMatch[2]) || 0
                            };
                        }
                        
                        // Парсим size (формат: size w h)
                        const sizeMatch = line.match(/^\s*size\s+([\d\.]+)\s+([\d\.]+)/);
                        if (sizeMatch) {
                            currentNode.size = {
                                w: parseFloat(sizeMatch[1]) || 0,
                                h: parseFloat(sizeMatch[2]) || 0
                            };
                        }
                        
                        // Парсим color (формат: color r g b a)
                        const colorMatch = line.match(/^\s*color\s+([\d\.]+)\s+([\d\.]+)\s+([\d\.]+)\s+([\d\.]+)/);
                        if (colorMatch) {
                            currentNode.color = {
                                r: parseFloat(colorMatch[1]) || 0,
                                g: parseFloat(colorMatch[2]) || 0,
                                b: parseFloat(colorMatch[3]) || 0,
                                a: parseFloat(colorMatch[4]) || 1
                            };
                        }
                    }
                    
                    // Обрабатываем закрывающую фигурную скобку
                    if (line === '}') {
                        // Извлекаем узел из стека
                        const finishedNode = nodeStack.pop();
                        
                        // Если у уз��а есть position и size - сохраняем для визуализации
                        if (finishedNode && finishedNode.position && finishedNode.size && 
                            finishedNode.size.w > 0 && finishedNode.size.h > 0) {
                            elements.push({...finishedNode});
                        }
                    }
                }

                // Визуализируем найденные элементы
                elements.forEach(element => {
                    const { position, size, color } = element;
                    
                    const div = document.createElement('div');
                    div.className = 'ui-element';
                    div.style.left = (position.x * 2) + 'px'; // масштабируем для наглядности
                    div.style.top = (position.y * 2) + 'px';
                    div.style.width = (size.w * 2) + 'px';
                    div.style.height = (size.h * 2) + 'px';
                    
                    if (color) {
                        div.style.backgroundColor = `rgba(${Math.round(color.r * 255)}, ${Math.round(color.g * 255)}, ${Math.round(color.b * 255)}, ${color.a})`;
                    } else {
                        div.style.backgroundColor = `rgba(${Math.floor(Math.random() * 200)}, ${Math.floor(Math.random() * 200)}, ${Math.floor(Math.random() * 200)}, 0.7)`;
                    }
                    
                    div.title = `${element.type} ${element.name}\nx:${position.x} y:${position.y} w:${size.w} h:${size.h}`;
                    
                    container.appendChild(div);
                });
                
                console.log(`Найдено элементов: ${elements.length}`);
            };
            reader.readAsText(file);
        });
    </script>

    <footer>
        &copy; 2026 Silver_77_Quests. Только для просмотра. Никакие данные не сохраняются.
    </footer>
</body>
</html>

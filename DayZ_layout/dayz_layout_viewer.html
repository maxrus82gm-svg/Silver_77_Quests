<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DayZ Layout Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .file-list { list-style-type: none; padding: 0; }
        .file-list li { margin: 5px 0; }
        .file-content { margin-top: 20px; padding: 10px; background-color: #f4f4f4; border: 1px solid #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>DayZ Layout Viewer</h1>
    <p>This is a read-only viewer for .layout files from the DayZ project.</p>
    <ul id="fileList" class="file-list">
        <!-- File list will be populated here -->
    </ul>
    <div id="content" class="file-content">
        Select a .layout file to view its content.
    </div>

    <script>
        // Read only — no dynamic file access possible in browser
        document.getElementById('content').textContent = 
            "Note: This is a static viewer. Actual .layout file content cannot be loaded without a backend or local file input.";
    </script>
</body>
</html>
